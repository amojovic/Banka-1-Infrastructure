# Redis — L2 cache za market-service stock price feed (cache-only, bez persistence).
# Docker-compose: redis:7-alpine, --save "" --appendonly no --maxmemory 128mb
# --maxmemory-policy allkeys-lru. Cache je efemeran pa Deployment (ne StatefulSet) +
# emptyDir je dovoljno; gubitak cache-a na restartu je benigan (re-fetch sa feed-a).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: banka-1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        args:
        - "redis-server"
        - "--save"
        - ""
        - "--appendonly"
        - "no"
        - "--maxmemory"
        - "128mb"
        - "--maxmemory-policy"
        - "allkeys-lru"
        ports:
        - name: redis
          containerPort: 6379
        livenessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 192Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: banka-1
spec:
  selector:
    app: redis
  ports:
  - name: redis
    port: 6379
    targetPort: 6379
